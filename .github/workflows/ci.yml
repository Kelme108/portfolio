# Builds the site with the GitHub Pages toolchain and runs the responsive/a11y suite.
# Deployment itself is still handled by GitHub Pages; this only guards against regressions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test tooling
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Responsive + accessibility tests
        working-directory: tests
        run: SHOTS=0 node responsive.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/output/

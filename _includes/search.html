<!-- Command palette / search (Ctrl+K or "/"). Index comes from /search.json -->
<dialog class="palette" id="palette" aria-label="Search write-ups" data-index="{{ '/search.json' | relative_url }}">
  <form method="dialog" class="palette-box" role="search">
    <div class="palette-input">
      {% include icon.html name="search" px="18" %}
      <input type="search" id="palette-q" placeholder="Search write-ups, tags, tools…" autocomplete="off" spellcheck="false" aria-controls="palette-results" aria-describedby="palette-hint">
      <kbd>Esc</kbd>
    </div>
    <ul class="palette-results" id="palette-results" role="listbox" aria-label="Results"></ul>
    <p class="palette-hint" id="palette-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Ctrl</kbd><kbd>K</kbd> toggle</span>
    </p>
  </form>
</dialog>

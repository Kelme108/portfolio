<div class="theme-toggle" role="radiogroup" aria-label="Color theme">
  <button type="button" role="radio" data-theme-value="light" aria-checked="false" title="Light">{% include icon.html name="sun" px="16" %}<span class="sr-only">Light</span></button>
  <button type="button" role="radio" data-theme-value="system" aria-checked="true" title="System">{% include icon.html name="monitor" px="16" %}<span class="sr-only">System</span></button>
  <button type="button" role="radio" data-theme-value="dark" aria-checked="false" title="Dark">{% include icon.html name="moon" px="16" %}<span class="sr-only">Dark</span></button>
</div>

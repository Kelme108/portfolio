<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" aria-hidden="true"><span></span></div>

  {% include topbar.html %}

  <div class="layout">
    {% include sidebar.html %}

    <main class="main" id="main" tabindex="-1">
      {{ content }}

      <footer class="site-footer">
        <p>© {{ site.time | date: "%Y" }} {{ site.author.name }} · Built with Jekyll · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
        <p class="site-footer-hint">Press <kbd>Ctrl</kbd> <kbd>K</kbd> to search</p>
      </footer>
    </main>
  </div>

  <button class="to-top icon-btn" type="button" data-to-top aria-label="Back to top" hidden>
    {% include icon.html name="arrow-up" px="20" %}
  </button>

  {% include search.html %}
</body>
</html>
